  <rect x="1" y="1" width="94" height="94" rx="21" fill="#141a26" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Handle: Single arc handle, 2px rounded stroke -->
  <path d="M 38 40 V 35 A 10 10 0 0 1 58 35 V 40" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bag Body: Clean symmetric trapezoid, 2px rounded stroke, no extra lines -->
  <path d="M 33 40 L 27.5 65 A 3.5 3.5 0 0 0 31 68.5 H 65 A 3.5 3.5 0 0 0 68.5 65 L 63 40 Z" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
