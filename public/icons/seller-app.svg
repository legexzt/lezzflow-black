<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- Tile: Dark rounded-square tile (~22% radius), fill #141a26, 1px border rgba(255,255,255,0.08) -->
  <rect x="1" y="1" width="94" height="94" rx="21" fill="#141a26" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Flat Awning Top Bar -->
  <path d="M 24 31 H 72" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Awning Body with 3 Rounded Scallops -->
  <path d="M 27 31 V 40 A 7 5.5 0 0 0 41 40 A 7 5.5 0 0 0 55 40 A 7 5.5 0 0 0 69 40 V 31" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Store Walls -->
  <path d="M 30 46 V 68.5" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 66 46 V 68.5" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Door: Simple Door Rectangle Below -->
  <path d="M 41 68.5 V 53 A 1.5 1.5 0 0 1 42.5 51.5 H 53.5 A 1.5 1.5 0 0 1 55 53 V 68.5" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ground Baseline -->
  <path d="M 24 68.5 H 72" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
